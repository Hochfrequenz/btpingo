name: guards
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Install ripgrep
        run: command -v rg || { sudo apt-get update -qq && sudo apt-get install -y ripgrep; }
      - name: No WARN-level logging
        run: |
          if grep -rnE --include='*.go' '\.Warn(Context)?\(' .; then
            echo "::error::No WARN level: return an error, or log at INFO/DEBUG." >&2; exit 1
          fi
      - name: No hand-rolled error bodies, no err.Error() in responses
        run: |
          set -uo pipefail
          fail=0
          # rg exits 0 on a match, 1 on no match, 2 on an error; only 1 passes.
          check() {
            rc=0
            rg -n -U --multiline-dotall --glob '*.go' --glob '!*_test.go' "$1" . || rc=$?
            case $rc in
              0) echo "::error::$2" >&2; fail=1 ;;
              1) ;;
              *) echo "::error::ripgrep failed" >&2; fail=1 ;;
            esac
          }
          check 'gin\.H\{.{0,400}?"error"' "Write error responses with ginpingo.AbortError."
          check '(c\.(JSON|IndentedJSON|PureJSON|AsciiJSON|SecureJSON|AbortWithStatusJSON|String|XML|YAML|Data)|http\.Error)\(.{0,300}?err\.Error\(\)' "err.Error() must not reach a client."
          exit $fail
      - name: Core package must not depend on gin
        run: |
          set -euo pipefail
          deps=$(go list -deps -test .)
          if grep -qx github.com/gin-gonic/gin <<<"$deps"; then
            echo "::error::core package btpingo must not depend on gin" >&2; exit 1
          fi
      - name: Core and ginpingo must not depend on connect
        run: |
          set -euo pipefail
          # only grpcpingo may pull in connect-go, authn and the genproto error details
          deps=$(go list -deps -test . ./ginpingo)
          if grep -E '^(connectrpc.com/|google.golang.org/genproto)' <<<"$deps"; then
            echo "::error::root package and ginpingo must not depend on connect or genproto" >&2; exit 1
          fi
      - name: Library code must not import btpingotest
        run: |
          set -euo pipefail
          # btpingotest holds mocks for tests and local setups; no shipped
          # package may depend on it, directly or transitively. Test files are
          # not part of `go list -deps` without -test. btpingotest itself and
          # internal/testkit (test fixtures that delegate to it) are exempt,
          # but internal/testkit must in turn stay out of every other package.
          mod=$(go list -m)
          fail=0
          pkgs=$(go list ./...)
          for pkg in $pkgs; do
            case "$pkg" in
              "$mod/btpingotest"|"$mod/internal/testkit") continue ;;
            esac
            # a failing go list (e.g. an import cycle) must fail the guard
            deps=$(go list -deps -f '{{.ImportPath}}' "$pkg")
            if grep -xE "$mod/(btpingotest|internal/testkit)" <<<"$deps"; then
              echo "::error::non-test package $pkg must not import btpingotest or internal/testkit" >&2
              fail=1
            fi
          done
          exit $fail
